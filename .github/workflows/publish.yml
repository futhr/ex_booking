name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    environment: hex-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Verify release identity
        run: mix run --no-compile --no-deps-check --no-start scripts/verify_release_ref.exs

      - name: Restore deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-28-1.18-${{ hashFiles('**/mix.lock') }}

      - name: Restore PLT cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-28-1.18-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run full quality gate
        run: mix check --no-retry

      - name: Verify clean release workspace
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare release paths
        run: |
          package_name="ex_booking-${GITHUB_REF_NAME#v}.tar"
          validated_dir="${RUNNER_TEMP}/validated"
          registry_dir="${RUNNER_TEMP}/registry"
          mkdir -p "${validated_dir}" "${registry_dir}"
          {
            echo "PACKAGE_NAME=${package_name}"
            echo "VALIDATED_PACKAGE=${validated_dir}/${package_name}"
            echo "REGISTRY_PACKAGE=${registry_dir}/${package_name}"
          } >> "${GITHUB_ENV}"

      - name: Build validated Hex package
        run: |
          mix hex.build --output "${VALIDATED_PACKAGE}"
          sha256sum "${VALIDATED_PACKAGE}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish package and documentation to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify published registry bytes
        run: |
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --output "${REGISTRY_PACKAGE}" \
            "https://repo.hex.pm/tarballs/${PACKAGE_NAME}"
          sha256sum "${VALIDATED_PACKAGE}" "${REGISTRY_PACKAGE}"
          cmp --silent "${VALIDATED_PACKAGE}" "${REGISTRY_PACKAGE}"
          cd "$(dirname "${REGISTRY_PACKAGE}")"
          sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"

      - name: Attest registry package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.REGISTRY_PACKAGE }}

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ex_booking-${{ github.ref_name }}-registry-package
          path: |
            ${{ env.REGISTRY_PACKAGE }}
            ${{ env.REGISTRY_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 90
